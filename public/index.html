<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TaskTracker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141414'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23ff4b1f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="beacon" id="beacon"></span>
      <h1>Task<em>Tracker</em></h1>
      <span class="tag">agents ⇄ human</span>
    </div>
    <div class="stats" id="stats"></div>
    <div class="top-actions">
      <button class="btn" id="agents-btn">🤖 Агенты</button>
      <button class="btn" id="mcp-btn">⌁ MCP</button>
      <button class="btn primary" id="new-btn">+ Задача</button>
    </div>
  </header>

  <main class="layout">
    <section class="board-wrap">
      <div class="filters">
        <input id="search" type="search" placeholder="Поиск по задачам…">
        <select id="agent-filter"><option value="">Все исполнители</option></select>
      </div>
      <div class="board" id="board"></div>
    </section>

    <aside class="side">
      <section class="line" id="line"></section>
      <section class="feed">
        <h2 class="sec-title">Журнал <span class="live">● live</span></h2>
        <ol id="feed"></ol>
      </section>
    </aside>
  </main>

  <div id="modal" class="modal" hidden></div>
  <div id="toasts"></div>
  <script src="app.js" type="module"></script>
</body>
</html>
